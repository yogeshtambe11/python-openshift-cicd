apiVersion: tekton.dev/v1
kind: Pipeline
metadata:
  name: python-cicd
spec:
  params:
    - name: repo-url
      type: string
      default: https://github.com/yogeshtambe11/python-openshift-cicd.git
    - name: revision
      type: string
      default: main
    - name: image
      type: string
      default: image-registry.openshift-image-registry.svc:5000/python-cicd/python-app
  workspaces:
    - name: shared-source
  tasks:
    - name: fetch-source
      taskRef:
        name: clone-source
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: revision
          value: $(params.revision)
      workspaces:
        - name: source
          workspace: shared-source

    - name: unit-tests
      runAfter:
        - fetch-source
      taskRef:
        name: python-test
      workspaces:
        - name: source
          workspace: shared-source

    - name: build-image
      runAfter:
        - unit-tests
      taskRef:
        name: buildah-push
      params:
        - name: image
          value: $(params.image)
        - name: tag
          value: $(tasks.fetch-source.results.commit)
      workspaces:
        - name: source
          workspace: shared-source

    - name: update-gitops
      runAfter:
        - build-image
      taskRef:
        name: update-gitops
      params:
        - name: repo-url
          value: $(params.repo-url)
        - name: branch
          value: $(params.revision)
        - name: image
          value: $(params.image)
        - name: tag
          value: $(tasks.fetch-source.results.commit)

